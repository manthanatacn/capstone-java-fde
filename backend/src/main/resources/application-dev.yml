# Local development defaults. Never use these values outside a developer machine.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthdekho}
    username: ${DB_USERNAME:healthdekho}
    password: ${DB_PASSWORD:healthdekho}
  sql:
    init:
      data-locations: classpath:data.sql,classpath:demo-data.sql   # spec sample, then demo extras

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

logging:
  level:
    com.healthdekho: DEBUG
